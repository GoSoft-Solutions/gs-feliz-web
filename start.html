<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comienza ahora — Feliz by Daniel Corral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Calendly popup stylesheet only (no badge) -->
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
  <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
</head>
<body class="start-body">

  <!-- NAV: minimal — back arrow left, FELIZ centered -->
  <nav class="cs-nav">
    <a href="/" class="cs-nav-back" aria-label="Regresar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
      </svg>
    </a>
    <a href="/" class="cs-nav-logo">FELIZ</a>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="cs-page">
    <div class="cs-shell">

      <!-- LEFT: copy -->
      <div class="cs-left">
        <h1 class="cs-title">Tu sesión de claridad está a punto de comenzar.</h1>
        <p class="cs-desc">Un espacio para detenerte, entender dónde estás y definir con claridad hacia dónde quieres ir.</p>
        <div class="cs-cta">
          <button
            class="cs-cta-btn"
            onclick="Calendly.initPopupWidget({url:'https://calendly.com/feliz-by-daniel-corral?hide_gdpr_banner=1'});return false;"
          >
            Empieza ahora
          </button>
        </div>
      </div>

      <!-- RIGHT: photo collage -->
      <div class="cs-right">
        <div class="cs-collage">
          <!-- Row 1: 3 small tiles -->
          <div class="cs-col cs-col--top">
            <div class="cs-tile cs-tile--sm"><img src="img/pilar-relaciones.jpg" alt=""></div>
            <div class="cs-tile cs-tile--sm"><img src="img/esposo.jpg" alt=""></div>
            <div class="cs-tile cs-tile--sm"><img src="img/aprendiz.jpg" alt=""></div>
          </div>
          <!-- Row 2: 1 large + 2 stacked -->
          <div class="cs-col cs-col--mid">
            <div class="cs-tile cs-tile--lg"><img src="img/hero-daniel.jpg" alt="Daniel Corral"></div>
            <div class="cs-col cs-col--mid-right">
              <div class="cs-tile cs-tile--md"><img src="img/medallista.jpg" alt=""></div>
              <div class="cs-tile cs-tile--md"><img src="img/creador.jpg" alt=""></div>
            </div>
          </div>
          <!-- Row 3: 3 small tiles -->
          <div class="cs-col cs-col--bot">
            <div class="cs-tile cs-tile--sm"><img src="img/olimpico.jpg" alt=""></div>
            <div class="cs-tile cs-tile--sm"><img src="img/autor.jpg" alt=""></div>
            <div class="cs-tile cs-tile--sm"><img src="img/pilar-mindset.jpg" alt=""></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
