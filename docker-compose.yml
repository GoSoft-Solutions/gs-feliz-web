services:
  postgres:
    image: postgres:16-alpine
    container_name: feliz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: feliz
      POSTGRES_PASSWORD: feliz
      POSTGRES_DB: feliz_dev
    ports:
      - "5432:5432"
    volumes:
      - feliz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feliz -d feliz_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  feliz_postgres_data:
